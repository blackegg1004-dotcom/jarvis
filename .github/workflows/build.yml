name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip latest uploaded source
        run: |
          f=$(git -c core.quotePath=false log -1 --name-only --pretty=format: -- '*.zip' | grep -m1 '\.zip$')
          echo "Using $f"
          unzip -o "$f" -x ".github/*"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk jarvis.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Jarvis latest
          files: jarvis.apk
